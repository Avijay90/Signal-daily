<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Daily: AI and markets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f1ec;--ink:#14213d;--mut:#5b6478;--card:#fff;--line:#d9d5cb;--acc:#0b7a75;--up:#1a7f4b;--dn:#c23b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--ink:#e8ebf2;--mut:#9aa4b8;--card:#182030;--line:#2a3448;--acc:#4fd1c5;--up:#4ade80;--dn:#f87171}}
:root[data-theme="dark"]{--bg:#10151f;--ink:#e8ebf2;--mut:#9aa4b8;--card:#182030;--line:#2a3448;--acc:#4fd1c5;--up:#4ade80;--dn:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
.meta{color:var(--mut);font-size:.85rem;margin:4px 0 20px}
.idx{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px}
.idx div{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:112px}
.idx b{display:block;font-size:.8rem;color:var(--mut);font-weight:600}.idx span{font-weight:800}
.up{color:var(--up)}.dn{color:var(--dn)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
article{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:14px 16px;margin-bottom:12px}
article h2{font-size:1.05rem;margin:0 0 4px}article p{margin:0 0 6px}
article small{color:var(--mut)}article a{color:var(--acc)}
.note{color:var(--mut);font-size:.8rem;margin-top:24px}
.idx svg{display:block;width:100%;height:26px;margin-top:4px}.idx polyline{fill:none;stroke:currentColor;stroke-width:2}
.st{display:flex;gap:6px;overflow-x:auto;margin:-8px 0 18px;padding-bottom:4px}
.st span{flex:0 0 auto;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px}
.h{font-size:.8rem;color:var(--mut);margin:0 0 6px;font-weight:600}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tg button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tg2{margin-top:6px}.tg2 em{font-style:normal;font-size:.75rem;color:var(--mut);margin-right:8px}
.idx div,.st span{cursor:pointer}.idx div:focus-visible,.st span:focus-visible,#dx:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.on{border-color:var(--acc)!important;box-shadow:0 0 0 1px var(--acc)}
.dp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:-6px 0 18px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#dx{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.dp svg{display:block;width:100%;height:120px}.dp polyline{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke}
.dp small{color:var(--mut)}.dp a{color:var(--acc);margin-left:8px;font-size:.85rem}
.sf{display:flex;gap:8px;margin-bottom:6px}.sf input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sf button{font:inherit;font-weight:600;border:0;background:var(--acc);color:var(--bg);border-radius:8px;padding:0 16px;cursor:pointer}
.sf input:focus-visible,.sf button:focus-visible,#sr button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sr{margin-bottom:14px}#sr button{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:0;padding:9px 12px;cursor:pointer}
#sr button:first-child{border-top:1px solid var(--line);border-radius:8px 8px 0 0}#sr button:last-child{border-radius:0 0 8px 8px}#sr button small{color:var(--mut)}
.msg{color:var(--mut);font-size:.85rem;margin:4px 0}
</style></head><body><main>
<h1>Signal Daily</h1>
<p class="meta" id="meta">Loading…</p>
<div class="idx" id="idx" aria-label="Market snapshot"></div>
<form class="sf" id="sf"><input id="q" type="search" placeholder="Search any stock worldwide, e.g. Tesla or RELIANCE.NS" aria-label="Search stocks" autocomplete="off"><button type="submit">Search</button></form>
<div id="sr" aria-live="polite"></div>
<p class="h">AI and big-tech stocks, today</p><div class="st" id="st"></div>
<div id="dt"></div>
<div class="tabs" role="tablist">
<button role="tab" aria-selected="true" data-t="ai">AI</button>
<button role="tab" aria-selected="false" data-t="markets">Stock market</button></div>
<div class="tg" id="tg"></div>
<section id="list"></section>
<p class="note">Automated summary of public news. Not financial advice.</p>
</main>
<script>
var GC="";/* GoatCounter site code, e.g. "mysignal" (see setup notes) */
if(GC){var g=document.createElement("script");g.async=true;g.src="https://gc.zgo.at/count.js";g.dataset.goatcounter="https://"+GC+".goatcounter.com/count";document.head.appendChild(g)}
var ser=[100,102,101,104,103,106,105,108,107,110,109,112];
var SAMPLE={updated:"Sample data (agent not run yet)",
indices:[{name:"S&P 500",symbol:"^GSPC",value:"sample",change:0.4,series:ser},{name:"Nasdaq",symbol:"^IXIC",value:"sample",change:-0.3,series:ser.slice().reverse()}],
stocks:[{symbol:"NVDA",price:0,change:1.2,series:ser},{symbol:"MSFT",price:0,change:-0.5}],
ai:[{title:"Sample AI story",summary:"The daily agent replaces this with real headlines.",source:"example.com",url:"#",tags:["OpenAI","Funding"]}],
markets:[{title:"Sample market story",summary:"The daily agent replaces this with real headlines.",source:"example.com",url:"#",tags:["Earnings"]}]};
var LIVE="https://little-dream-15a6.toankurvijay-90.workers.dev";/* Cloudflare Worker URL, e.g. https://quotes.yourname.workers.dev */
var LIVE_T="";
function live(){if(!LIVE||document.hidden)return;
var sy=(D.indices||[]).map(function(i){return i.symbol}).concat((D.stocks||[]).map(function(s){return s.symbol})).filter(Boolean);
if(!sy.length)return;
fetch(LIVE+"?symbols="+encodeURIComponent(sy.join(","))).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(q){
(D.indices||[]).forEach(function(i){var x=q[i.symbol];if(x){i.value=x.price.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});i.change=x.change}});
(D.stocks||[]).forEach(function(s){var x=q[s.symbol];if(x){s.price=x.price;s.change=x.change}});
D.stocks.sort(function(a,b){return b.change-a.change});
LIVE_T=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});render()}).catch(function(){})}
var SEL=null;
var D=SAMPLE,tab="ai",tag=null;
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function safe(u){return /^https?:\/\//.test(u)?u:"#"}
function pct(c){c=Number(c)||0;return '<span class="'+(c>=0?"up":"dn")+'">'+(c>=0?"+":"")+c.toFixed(2)+"%</span>"}
function spark(a,c){if(!a||a.length<2)return"";var lo=Math.min.apply(0,a),hi=Math.max.apply(0,a),r=hi-lo||1;
var p=a.map(function(v,i){return (i/(a.length-1)*100).toFixed(1)+","+(26-(v-lo)/r*24).toFixed(1)}).join(" ");
return '<svg viewBox="0 0 100 28" preserveAspectRatio="none" class="'+(c>=0?"up":"dn")+'"><polyline points="'+p+'"/></svg>'}
function meta(){var m=document.getElementById("meta"),t=D.updated_iso?Math.round((Date.now()-new Date(D.updated_iso))/60000):null;
m.textContent="Last updated: "+D.updated+(t!==null&&t>=0?" ("+(t<1?"just now":t<60?t+" min ago":Math.round(t/60)+" h ago")+")":"")+(LIVE_T?". Live prices as of "+LIVE_T+".":". Prices may be delayed ~15 min.")}
function big(a,c){if(!a||a.length<2)return"<p>Chart data not available yet.</p>";var lo=Math.min.apply(0,a),hi=Math.max.apply(0,a),r=hi-lo||1;
var p=a.map(function(v,i){return (i/(a.length-1)*100).toFixed(1)+","+(38-(v-lo)/r*36).toFixed(1)}).join(" ");
return '<svg viewBox="0 0 100 40" preserveAspectRatio="none" class="'+(c>=0?"up":"dn")+'"><polyline points="'+p+'"/></svg>'}
function detail(){var el=document.getElementById("dt");if(!SEL){el.innerHTML="";return}
var x=(D.indices||[]).concat(D.stocks||[]).concat(EXTRA?[EXTRA]:[]).filter(function(a){return a.symbol===SEL})[0];if(!x){el.innerHTML="";return}
var a=x.series||[],lo=a.length?Math.min.apply(0,a):0,hi=a.length?Math.max.apply(0,a):0,pr=x.value||(x.price!=null?Number(x.price).toFixed(2):"");
el.innerHTML='<div class="dp"><div class="dh"><div><b>'+esc(x.name||x.symbol)+"</b> "+esc(pr)+" "+pct(x.change)+'</div><button id="dx" aria-label="Close chart">Close</button></div>'+big(a,x.change)+
'<small>Last month: low '+lo.toFixed(2)+", high "+hi.toFixed(2)+'</small><a href="https://finance.yahoo.com/quote/'+encodeURIComponent(x.symbol)+'/" target="_blank" rel="noopener">Full chart on Yahoo Finance</a></div>';
document.getElementById("dx").onclick=function(){SEL=null;render()}}
function pick(e){var t=e.target.closest&&e.target.closest("[data-s]");if(!t)return;SEL=SEL===t.dataset.s?null:t.dataset.s;render()}
document.addEventListener("click",pick);
document.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var t=e.target.closest&&e.target.closest("[data-s]");if(t){e.preventDefault();pick(e)}}});
var EXTRA=null,qt;
function api(p){return LIVE.replace(/\/$/,"")+p}
function sr(h){document.getElementById("sr").innerHTML=h}
function doSearch(q){if(!LIVE)return;
fetch(api("/search?q="+encodeURIComponent(q))).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(L){
sr(L.length?L.map(function(x){return '<button data-f="'+esc(x.symbol)+'"><b>'+esc(x.symbol)+"</b> "+esc(x.name)+" <small>"+esc(x.exch)+"</small></button>"}).join(""):'<p class="msg">No matches. Try a company name or ticker.</p>')}).catch(function(){sr('<p class="msg">Search is unavailable right now.</p>')})}
document.getElementById("q").addEventListener("input",function(e){clearTimeout(qt);var v=e.target.value.trim();if(v.length<2){sr("");return}qt=setTimeout(function(){doSearch(v)},300)});
document.getElementById("sf").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("q").value.trim();if(!v)return;
if(LIVE)doSearch(v);else window.open("https://finance.yahoo.com/lookup?s="+encodeURIComponent(v),"_blank","noopener")});
document.getElementById("sr").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(!b)return;
fetch(api("/chart?symbol="+encodeURIComponent(b.dataset.f))).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(x){
if(x.error)throw 0;EXTRA=x;SEL=x.symbol;sr("");render();document.getElementById("dt").scrollIntoView({block:"nearest",behavior:"smooth"})}).catch(function(){sr('<p class="msg">Could not load that chart.</p>')})});
function render(){detail();
meta();
document.getElementById("idx").innerHTML=(D.indices||[]).map(function(i){
return '<div role="button" tabindex="0" data-s="'+esc(i.symbol)+'" class="'+(SEL&&SEL===i.symbol?"on":"")+'"><b>'+esc(i.name)+'</b><span>'+esc(i.value)+"</span> "+pct(i.change)+spark(i.series,i.change)+"</div>"}).join("");
document.getElementById("st").innerHTML=(D.stocks||[]).map(function(s){return '<span role="button" tabindex="0" data-s="'+esc(s.symbol)+'" class="'+(SEL&&SEL===s.symbol?"on":"")+'">'+esc(s.symbol)+" "+pct(s.change)+"</span>"}).join("");
var L=D[tab]||[],cnt={};L.forEach(function(n){(n.tags||[]).forEach(function(t){cnt[t]=(cnt[t]||0)+1})});
document.getElementById("tg").innerHTML=Object.keys(cnt).map(function(t){return '<button aria-pressed="'+(t===tag)+'" data-g="'+esc(t)+'">'+esc(t)+" "+cnt[t]+"</button>"}).join("");
document.querySelectorAll("#tg button").forEach(function(b){b.onclick=function(){tag=tag===b.dataset.g?null:b.dataset.g;render()}});
document.getElementById("list").innerHTML=L.filter(function(n){return !tag||(n.tags||[]).indexOf(tag)>-1}).map(function(n){
return '<article><h2>'+esc(n.title)+"</h2>"+(n.summary?"<p>"+esc(n.summary)+"</p>":"")+'<small><a href="'+safe(n.url)+'" target="_blank" rel="noopener">'+esc(n.source)+" - read story</a></small></article>"}).join("")}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;tag=null;
document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b)});render()}});
render();
function load(){fetch("data.json?"+Date.now()).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){D=j;render();live()}).catch(function(){})}
load();setInterval(function(){if(!document.hidden)load()},300000);setInterval(meta,30000);setInterval(live,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script></body></html>
