document.getElementById("q").addEventListener("input",function(e){clearTimeout(qt);var v=e.target.value.trim();if(v.length<2){sr("");return}qt=setTimeout(function(){doSearch(v)},300)});
document.getElementById("sf").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("q").value.trim();if(!v)return;
if(LIVE)doSearch(v);else window.open("https://finance.yahoo.com/lookup?s="+encodeURIComponent(v),"_blank","noopener")});
document.getElementById("sr").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(!b)return;
fetch(api("/chart?symbol="+encodeURIComponent(b.dataset.f))).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(x){
if(x.error)throw 0;EXTRA=x;SEL=x.symbol;sr("");render();document.getElementById("dt").scrollIntoView({block:"nearest",behavior:"smooth"})}).catch(function(){sr('<p class="msg">Could not load that chart.</p>')})});
function render(){detail();renderW();
meta();
document.getElementById("idx").innerHTML=(D.indices||[]).map(function(i){
return '<div role="button" tabindex="0" data-s="'+esc(i.symbol)+'" class="'+(SEL&&SEL===i.symbol?"on":"")+'"><b>'+esc(i.name)+'</b><span>'+esc(i.value)+"</span> "+pct(i.change)+spark(i.series,i.change)+"</div>"}).join("");
document.getElementById("st").innerHTML=(D.stocks||[]).map(function(s){return '<span role="button" tabindex="0" data-s="'+esc(s.symbol)+'" class="'+(SEL&&SEL===s.symbol?"on":"")+'">'+esc(s.symbol)+" "+pct(s.change)+"</span>"}).join("");
var L=D[tab]||[],cnt={};L.forEach(function(n){(n.tags||[]).forEach(function(t){cnt[t]=(cnt[t]||0)+1})});
document.getElementById("tg").innerHTML=Object.keys(cnt).map(function(t){return '<button aria-pressed="'+(t===tag)+'" data-g="'+esc(t)+'">'+esc(t)+" "+cnt[t]+"</button>"}).join("");
document.querySelectorAll("#tg button").forEach(function(b){b.onclick=function(){tag=tag===b.dataset.g?null:b.dataset.g;render()}});
document.getElementById("list").innerHTML=L.filter(function(n){return !tag||(n.tags||[]).indexOf(tag)>-1}).map(function(n){
return '<article><h2>'+esc(n.title)+"</h2>"+(n.summary?"<p>"+esc(n.summary)+"</p>":"")+'<small><a href="'+safe(n.url)+'" target="_blank" rel="noopener">'+esc(n.source)+" - read story</a></small></article>"}).join("")}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;tag=null;
document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b)});render()}});
render();
function load(){fetch("data.json?"+Date.now()).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){D=j;render();live()}).catch(function(){})}
load();setInterval(function(){if(!document.hidden)load()},300000);setInterval(meta,30000);setInterval(live,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script></body></html>
